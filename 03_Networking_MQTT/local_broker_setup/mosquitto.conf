# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto local broker — Digital Twin project
# Start with: mosquitto -v -c 03_Networking_MQTT/local_broker_setup/mosquitto.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── TCP listener (port 1883) ──────────────────────────────────────────────────
# Used by: Python publisher, Webots controller, mobile Plan-B fallback.
# Browsers cannot use raw TCP — they must use the WebSocket listener below.
listener 1883
allow_anonymous true

# ── WebSocket listener (port 9001) ────────────────────────────────────────────
# Used by: Flutter Web (browsers connect via ws://127.0.0.1:9001).
# Required because browsers can only speak WebSocket, not raw TCP.
listener 9001
protocol websockets
allow_anonymous true
